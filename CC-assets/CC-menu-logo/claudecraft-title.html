<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaudeCraft — Title Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ===== ClaudeCraft title screen =================================
     Framework-free. Drop into any page or use as a standalone screen.
     Structure:
       .cc-title            full-viewport stage (sunset preset)
         .cc-sky            gradient backdrop
         .cc-sun/.cc-cloud  parallax scenery
         .cc-range*/.cc-ground  mesas + foreground
         .cc-vignette       edge shading
         .cc-badge          version tag (top-left)
         .cc-center         wordmark + tagline
         .cc-prompt         blinking "press start"
     Swap copy freely. Colors live in the CSS custom props below. ===== */
  :root{
    --cc-ink:#17100a;            /* outline / extrusion base   */
    --cc-terra:#b9662f;          /* terracotta block           */
    --cc-terra-d:#a24d27;
    --cc-clay:#cf9152;           /* clay / sand block          */
    --cc-clay-l:#b98c66;
    --cc-cobble:#9296a0;         /* cobblestone block          */
    --cc-cobble-d:#8a8a90;
    --cc-rust:#c07235;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#1a1330;font-family:'VT323',monospace;overflow:hidden}

  .cc-title{position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden}

  .cc-sky{position:absolute;inset:0;z-index:0;
    background:linear-gradient(180deg,#2d1b4e 0%,#7a3b6e 33%,#c96a4f 58%,#f2a65a 82%,#f8ca70 100%)}

  .cc-sun{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);width:200px;height:200px;z-index:1;
    background:radial-gradient(circle at 50% 45%,#ffe6a0 0 30%,#ffb14d 30% 62%,#ff8a3c 62% 100%);
    box-shadow:0 0 90px 34px rgba(255,150,70,.5);
    clip-path:polygon(20% 0,80% 0,80% 8%,92% 8%,92% 20%,100% 20%,100% 80%,92% 80%,92% 92%,80% 92%,80% 100%,20% 100%,20% 92%,8% 92%,8% 80%,0 80%,0 20%,8% 20%,8% 8%,20% 8%);
    animation:cc-sun 6s ease-in-out infinite}

  .cc-cloud{position:absolute;z-index:2;width:52px;height:24px;background:#f7d9c6;opacity:.85;
    box-shadow:52px 6px 0 #f7d9c6,104px 0 0 #f7d9c6,156px 8px 0 #f7d9c6,52px -18px 0 #fbe7da}
  .cc-cloud.two{top:20%;left:66%;width:36px;height:16px;opacity:.7;background:#f3cbb6;
    box-shadow:36px 6px 0 #f3cbb6,72px 0 0 #f3cbb6;animation:cc-drift2 18s ease-in-out infinite alternate}
  .cc-cloud.one{top:12%;left:12%;animation:cc-drift 15s ease-in-out infinite alternate}

  .cc-range-far{position:absolute;left:-2%;right:-2%;bottom:135px;height:240px;z-index:2;opacity:.9;
    background:linear-gradient(180deg,#8a3d24,#6f2f1c);
    clip-path:polygon(0 100%,0 66%,12% 66%,12% 52%,30% 52%,30% 66%,44% 66%,44% 44%,60% 44%,60% 60%,74% 60%,74% 34%,92% 34%,92% 62%,100% 62%,100% 100%)}
  .cc-range-near{position:absolute;left:-2%;right:-2%;bottom:125px;height:190px;z-index:3;
    background:linear-gradient(180deg,#b25a2c,#93441f);
    clip-path:polygon(0 100%,0 72%,16% 72%,16% 58%,30% 58%,30% 74%,50% 74%,50% 50%,68% 50%,68% 68%,84% 68%,84% 56%,100% 56%,100% 100%)}
  .cc-range-near.tex{background:repeating-linear-gradient(0deg,rgba(255,220,170,.12) 0 2px,transparent 2px 18px);pointer-events:none}

  .cc-ground{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:4;
    background:linear-gradient(180deg,#cf9152 0 20px,#b3763e 20px 52px,#95602f 52px 96px,#7f4f27 96px 100%)}
  .cc-ground.seams{pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,transparent 2px 68px),repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 2px,transparent 2px 30px)}

  .cc-vignette{position:absolute;inset:0;z-index:5;pointer-events:none;
    box-shadow:inset 0 -80px 130px rgba(40,10,30,.35),inset 0 40px 90px rgba(255,220,160,.12)}

  .cc-badge{position:absolute;top:20px;left:24px;z-index:7;font-size:clamp(13px,1.6vw,22px);
    letter-spacing:2px;color:rgba(255,240,225,.85);text-shadow:1px 1px 0 rgba(0,0,0,.5)}

  .cc-center{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:clamp(18px,3vh,34px);padding-bottom:9vh;pointer-events:none}

  .cc-wordmark{margin:0;font-family:'Bungee',sans-serif;font-size:clamp(46px,9vw,120px);line-height:1;
    text-align:center;animation:cc-float 5s ease-in-out infinite;
    text-shadow:-1px -1px 0 rgba(255,255,255,.22),
      3px 0 var(--cc-ink,#17100a),-3px 0 var(--cc-ink,#17100a),0 3px var(--cc-ink,#17100a),0 -3px var(--cc-ink,#17100a),
      2px 2px var(--cc-ink,#17100a),-2px 2px var(--cc-ink,#17100a),2px -2px var(--cc-ink,#17100a),-2px -2px var(--cc-ink,#17100a),
      5px 5px #2a1c10,6px 6px #281a0f,8px 8px #26180d,10px 10px #24160c,12px 12px #21140b,
      14px 14px #1f120a,16px 16px #1d1009,18px 18px #1a0e08,20px 20px #170c06,22px 22px #150b05,
      4px 26px 28px rgba(0,0,0,.45)}

  .cc-tagline{font-size:clamp(18px,2.4vw,32px);letter-spacing:8px;color:#fff;
    background:rgba(28,10,6,.5);padding:6px 24px;border:2px solid rgba(255,255,255,.35);
    box-shadow:0 4px 0 rgba(0,0,0,.3)}

  .cc-prompt{position:absolute;bottom:4%;left:0;right:0;z-index:7;text-align:center;
    font-size:clamp(20px,2.6vw,34px);letter-spacing:5px;color:#fff;
    text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:cc-blink 1.1s steps(1,end) infinite;cursor:pointer}

  @keyframes cc-drift{from{transform:translateX(0)}to{transform:translateX(54px)}}
  @keyframes cc-drift2{from{transform:translateX(0)}to{transform:translateX(-44px)}}
  @keyframes cc-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes cc-blink{0%,58%{opacity:1}59%,100%{opacity:.12}}
  @keyframes cc-sun{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.035)}}
  @media (prefers-reduced-motion:reduce){.cc-sun,.cc-cloud,.cc-wordmark,.cc-prompt{animation:none}}
</style>
</head>
<body>
  <main class="cc-title">
    <div class="cc-sky"></div>
    <div class="cc-sun"></div>
    <div class="cc-cloud one"></div>
    <div class="cc-cloud two"></div>
    <div class="cc-range-far"></div>
    <div class="cc-range-near"></div>
    <div class="cc-range-near tex"></div>
    <div class="cc-ground"></div>
    <div class="cc-ground seams"></div>
    <div class="cc-vignette"></div>

    <div class="cc-badge">CLAUDECRAFT &middot; v0.1 ALPHA</div>

    <div class="cc-center">
      <h1 class="cc-wordmark"><span style="color:var(--cc-rust,#c07235)">C</span><span style="color:var(--cc-terra-d,#a24d27)">l</span><span style="color:var(--cc-clay,#cf9152)">a</span><span style="color:var(--cc-terra,#b9662f)">u</span><span style="color:var(--cc-cobble,#9296a0)">d</span><span style="color:#a95a2c">e</span><span style="color:var(--cc-clay,#cf9152)">C</span><span style="color:var(--cc-cobble-d,#8a8a90)">r</span><span style="color:var(--cc-rust,#c07235)">a</span><span style="color:var(--cc-terra-d,#a24d27)">f</span><span style="color:var(--cc-clay-l,#b98c66)">t</span></h1>
      <div class="cc-tagline">ENDLESS WORLDS AWAIT</div>
    </div>

    <div class="cc-prompt" id="cc-start">&#9654; PRESS START</div>
  </main>

  <script>
    // Fires when the player starts the game. Wire this into your app.
    document.getElementById('cc-start').addEventListener('click', function () {
      document.dispatchEvent(new CustomEvent('claudecraft:start'));
      // e.g. router.push('/play') or startGame();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') document.getElementById('cc-start').click();
    });
  </script>
</body>
</html>
